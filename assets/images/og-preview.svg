<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FD6909" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181818" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#181818" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  
  <!-- Subtle Grid lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#333333" stroke-width="0.5" stroke-dasharray="4 4" />
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#333333" stroke-width="0.5" stroke-dasharray="4 4" />
  <line x1="200" y1="0" x2="200" y2="630" stroke="#333333" stroke-width="0.5" stroke-dasharray="4 4" />
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#333333" stroke-width="0.5" stroke-dasharray="4 4" />

  <!-- Logo Mark -->
  <rect x="100" y="100" width="60" height="60" rx="12" fill="#0D0D0D" stroke="#FD6909" stroke-width="2" />
  <path d="M120 145 L132 120 L140 135 L150 115" stroke="#FD6909" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Typography -->
  <text x="180" y="142" font-family="sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SEARCH<tspan fill="#FD6909">FORGE</tspan></text>
  <text x="180" y="165" font-family="monospace" font-size="12" font-weight="600" fill="#999999" letter-spacing="3">TECHNICAL SEO RESCUE</text>

  <!-- Big Hero Title -->
  <text x="100" y="270" font-family="sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">Your Website Is Broken.</text>
  <text x="100" y="340" font-family="sans-serif" font-size="56" font-weight="800" fill="#FD6909">Let's Find Out Why.</text>

  <text x="100" y="410" font-family="sans-serif" font-size="22" font-weight="400" fill="#B0B0B0">A Deliberately Flawed Website for Technical SEO Diagnosis &amp; Rescue</text>

  <!-- Metric Badges -->
  <rect x="100" y="460" width="220" height="65" rx="8" fill="#242424" stroke="#3A3A3A" />
  <text x="120" y="490" font-family="sans-serif" font-size="11" fill="#999999">HEALTH SCORE</text>
  <text x="120" y="515" font-family="monospace" font-size="22" font-weight="700" fill="#10B981">98 / 100</text>

  <rect x="340" y="460" width="220" height="65" rx="8" fill="#242424" stroke="#3A3A3A" />
  <text x="360" y="490" font-family="sans-serif" font-size="11" fill="#999999">FLAWS ISOLATED</text>
  <text x="360" y="515" font-family="monospace" font-size="22" font-weight="700" fill="#FD6909">15 SCENARIOS</text>

  <rect x="580" y="460" width="220" height="65" rx="8" fill="#242424" stroke="#3A3A3A" />
  <text x="600" y="490" font-family="sans-serif" font-size="11" fill="#999999">CRAWLABILITY</text>
  <text x="600" y="515" font-family="monospace" font-size="22" font-weight="700" fill="#FFFFFF">100% CANONICAL</text>
</svg>
